version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: gcm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gcm_db
      POSTGRES_USER: gcm
      POSTGRES_PASSWORD: gcm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcm -d gcm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gcm_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://gcm:gcm_password@db:5432/gcm_db
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-min-32-chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://frontend"]'
      UPLOAD_DIR: /app/uploads
      DEBUG: "false"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gcm_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
